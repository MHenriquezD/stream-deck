# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false

# Recomendado por el propio aviso de AGP para acelerar el import del proyecto.
android.dependency.excludeLibraryComponentsFromConstraints=true

# El flatDir sale de los build.gradle que genera Capacitor (app y
# capacitor-cordova-android-plugins) para tomar los .aar locales de los
# plugins; no es algo que podamos quitar de nuestro lado.
android.sync.suppressAgpWarnings=FLAT_DIR_REPOSITORY_USED

# ── Flags de compatibilidad AGP 8 → 9 ─────────────────────────────────────
# Los puso el asistente de actualización de Android Studio para conservar el
# comportamiento viejo. Todos desaparecen en AGP 10, así que en algún momento
# hay que migrar; cambiarlos altera el build de verdad (sobre todo newDsl),
# así que conviene hacerlo de a uno y probando, no de golpe.
#
# Ya se quitaron tres que no hacían nada en este proyecto:
#   android.usesSdkInManifest.disallowed  → el manifest no declara uses-sdk
#   android.defaults.buildfeatures.resvalues → no se usa resValue en ningún lado
#   android.sdk.defaultTargetSdkToCompileSdkIfUnset → targetSdk está explícito
android.enableAppCompileTimeRClass=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
