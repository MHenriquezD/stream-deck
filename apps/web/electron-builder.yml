appId: com.spartanhub.app
productName: Spartan Hub

directories:
  output: ../../release
  buildResources: build

asar: true

win:
  target:
    - nsis
    - portable
  icon: icon.ico

nsis:
  oneClick: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Spartan Hub
  installerIcon: icon.ico
  uninstallerIcon: icon.ico

portable:
  artifactName: ${productName}-${version}-portable.exe

files:
  - from: dist
    to: dist
    filter:
      - "**/*"
  - electron-main.mjs
  - preload.cjs
  - package.json

extraResources:
  - from: ../server/dist
    to: backend
    filter:
      - "**/*"
  - from: ../server/native_modules/node_modules
    to: backend/node_modules
    filter:
      - "**/*"
  - from: ../server/data
    to: backend/data
    filter:
      - "**/*"
      - "!*.json"
      - "!audio-helper.ps1"
      - "!app-icons/**"
      - "!custom-icons/**"
